# Prometheus scrape config — plain Prometheus, static config.
#
# Deliberately NO Prometheus Operator / ServiceMonitor: on this 12GB box the
# operator + CRDs + kube-state-metrics cost ~0.5-1GB that the serving plane
# needs. Static targets are enough for two scrape jobs (see Blueprint audit).
#
# Scrapes:
#   - vLLM /metrics  -> qwen-llm-kserve-workload-svc.kserve.svc.cluster.local:8000
#   - llm-d EPP      -> llm-d-epp.kserve.svc.cluster.local:9090 (pool health)
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: vllm
        metrics_path: /metrics
        static_configs:
          - targets: ["qwen-llm-kserve-workload-svc.kserve.svc.cluster.local:8000"]
            labels:
              component: vllm
      - job_name: llm-d-epp
        metrics_path: /metrics
        static_configs:
          - targets: ["llm-d-epp.kserve.svc.cluster.local:9090"]
            labels:
              component: epp
