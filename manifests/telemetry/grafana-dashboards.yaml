# Grafana provisioning: NanoServe vLLM dashboard (read-only).
# Metric names verified against the live vLLM /metrics export (2026-09-08):
#   vllm:kv_cache_usage_perc, vllm:num_requests_running/waiting,
#   vllm:time_to_first_token_seconds (histogram),
#   vllm:request_decode_time_seconds (histogram),
#   vllm:prompt_tokens_total / vllm:generation_tokens_total,
#   vllm:num_requests_total
# All expressions use rate(...[1m])/histogram_quantile so panels respond
# within a minute of traffic (scrape interval 15s).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  nanoserve-vllm.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "title": "Capacity & queue",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "unit": "percentunit", "decimals": 2, "min": 0, "max": 1 },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 1 },
          "id": 1,
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "vllm:kv_cache_usage_perc{model_name=~\".+\"}",
              "legendFormat": "{{model_name}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "KV cache usage by model (4GB cap)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "unit": "percentunit", "decimals": 2, "min": 0, "max": 1 },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 1 },
          "id": 2,
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum(rate(vllm:prefix_cache_hits_total[1m])) / clamp_min(sum(rate(vllm:prefix_cache_queries_total[1m])), 0.0001)",
              "legendFormat": "prefix-cache hit ratio",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Prefix-cache hit ratio (multi-turn reuse)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "unit": "short", "decimals": 0 },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 9 },
          "id": 3,
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum(vllm:num_requests_running)",
              "legendFormat": "running",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum(vllm:num_requests_waiting)",
              "legendFormat": "waiting",
              "range": true,
              "refId": "B"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum(increase(vllm:num_preemptions_total[1m]))",
              "legendFormat": "preemptions/min",
              "range": true,
              "refId": "C"
            }
          ],
          "title": "Queue pressure (running / waiting / preemptions)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "unit": "reqps", "decimals": 2 },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 9 },
          "id": 4,
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum(rate(vllm:request_success_total[1m]))",
              "legendFormat": "req/s",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Request rate (successes)",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 17 },
          "id": 101,
          "title": "Latency",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "unit": "s", "decimals": 3 },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 18 },
          "id": 5,
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "histogram_quantile(0.50, sum(rate(vllm:time_to_first_token_seconds_bucket[1m])) by (le))",
              "legendFormat": "ttft p50",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum(rate(vllm:time_to_first_token_seconds_bucket[1m])) by (le))",
              "legendFormat": "ttft p95",
              "range": true,
              "refId": "B"
            }
          ],
          "title": "Time-to-first-token (TTFT) p50/p95",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "unit": "s", "decimals": 3 },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 18 },
          "id": 6,
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "histogram_quantile(0.50, sum(rate(vllm:request_decode_time_seconds_bucket[1m])) by (le))",
              "legendFormat": "decode p50",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum(rate(vllm:request_decode_time_seconds_bucket[1m])) by (le))",
              "legendFormat": "decode p95",
              "range": true,
              "refId": "B"
            }
          ],
          "title": "Decode (inter-token) latency p50/p95",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 26 },
          "id": 102,
          "title": "Throughput & tokens",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "unit": "tokps", "decimals": 1 },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 27 },
          "id": 7,
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum(rate(vllm:generation_tokens_total[1m]))",
              "legendFormat": "gen tok/s",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum(rate(vllm:prompt_tokens_total[1m]))",
              "legendFormat": "prompt tok/s",
              "range": true,
              "refId": "B"
            }
          ],
          "title": "Token throughput (gen / prompt)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "unit": "short", "decimals": 0 },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 27 },
          "id": 8,
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum(increase(vllm:prompt_tokens_total[1m]))",
              "legendFormat": "prompt tok/min",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum(increase(vllm:generation_tokens_total[1m]))",
              "legendFormat": "gen tok/min",
              "range": true,
              "refId": "B"
            }
          ],
          "title": "Tokens per minute",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 35 },
          "id": 103,
          "title": "Cumulative",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "unit": "short", "decimals": 0 },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 36 },
          "id": 9,
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum(increase(vllm:request_success_total[5m]))",
              "legendFormat": "req (5m)",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Cumulative requests (5m)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "unit": "short", "decimals": 0 },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 36 },
          "id": 10,
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum(increase(vllm:generation_tokens_total[5m]))",
              "legendFormat": "gen tok (5m)",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum(increase(vllm:prompt_tokens_total[5m]))",
              "legendFormat": "prompt tok (5m)",
              "range": true,
              "refId": "B"
            }
          ],
          "title": "Cumulative tokens (5m)",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 44 },
          "id": 104,
          "title": "Gateway & rejections (429 rate-limit / 400 context / 413 body)",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "unit": "reqps", "decimals": 2 },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 45 },
          "id": 11,
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum(rate(envoy_http_downstream_rq_completed{envoy_http_conn_manager_prefix=\"http-10080\"}[1m]))",
              "legendFormat": "gateway req/s",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum(rate(vllm:request_success_total[1m]))",
              "legendFormat": "vllm ok/s",
              "range": true,
              "refId": "B"
            }
          ],
          "title": "Gateway request rate vs vLLM successes",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "unit": "reqps", "decimals": 2 },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 45 },
          "id": 12,
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "clamp_min(sum(rate(envoy_http_downstream_rq_completed{envoy_http_conn_manager_prefix=\"http-10080\"}[1m])) - sum(rate(vllm:request_success_total[1m])), 0)",
              "legendFormat": "rejections/s (gateway non-200)",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "sum(rate(envoy_http_downstream_rq_too_large[1m]))",
              "legendFormat": "413 too-large/s",
              "range": true,
              "refId": "B"
            }
          ],
          "title": "Gateway rejections (429/400/413 inferred)",
          "type": "timeseries"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": ["nanoserve"],
      "templating": { "list": [] },
      "time": { "from": "now-15m", "to": "now" },
      "timepicker": {},
      "timezone": "",
      "title": "NanoServe vLLM",
      "uid": "nanoserve-vllm",
      "version": 2,
      "weekStart": ""
    }
