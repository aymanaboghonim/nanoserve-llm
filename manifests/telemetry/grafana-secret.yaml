# Grafana admin credentials — TEMPLATE only. The real password lives in the
# gitignored .env and is applied via the Makefile target (`make secret-grafana`).
#
#   # .env (gitignored)
#   GRAFANA_ADMIN_PASSWORD=<your-password>
#
#   make secret-grafana   # renders this manifest from .env
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoring
type: Opaque
stringData:
  admin-user: "admin"
  # placeholder — replaced by `make secret-grafana` from .env (gitignored)
  admin-password: "CHANGE_ME"
