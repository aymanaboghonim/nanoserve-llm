# Grafana via the serving gateway — OPTIONAL LAN convenience route.
#
# The hostname is pinned to the CURRENT gateway LB (nip.io wildcard). WSL2
# reassigns the LB on host restarts, so update this file + Argo syncs it:
#   kubectl get gateway kserve-gateway -n kserve -o jsonpath='{.status.addresses[0].value}'
#   -> hostname: grafana.<that-IP>.nip.io
# (The hostname must be a literal DNS name — a placeholder is rejected.)
#
# Default (no LAN route needed): `make observability` -> http://localhost:3000
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: kserve-gateway
      namespace: kserve
  hostnames:
    - grafana.192.168.1.43.nip.io
  rules:
    - backendRefs:
        - name: grafana
          port: 3000
