# Grafana via the serving gateway — OPTIONAL LAN convenience route.
#
# The hostname must match your CURRENT gateway LB (nip.io wildcard). WSL2
# reassigns the LB on host restarts, so update it after each restart:
#   kubectl get gateway kserve-gateway -n kserve -o jsonpath='{.status.addresses[0].value}'
#   -> hostname: grafana.<that-IP>.nip.io
#
# Default (no LAN route needed): `make observability` -> http://localhost:3000
#
#   curl -H 'Host: grafana.<LB>.nip.io' http://<LB>/api/health
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: kserve-gateway
      namespace: kserve
  hostnames:
    - grafana.<gateway-lb>.nip.io
  rules:
    - backendRefs:
        - name: grafana
          port: 3000
