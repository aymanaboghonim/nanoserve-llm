# Gateway API platform objects for KServe LLMInferenceService (Phase 3).
# Applied after the Gateway API + GIE CRDs and Envoy (AI) Gateway controllers
# are installed (see manifests/infra/gateway-stack.sh).
#
# NOTE: gateway-api/ CRD YAMLs are vendored (pinned) under this directory; the
# GatewayClass/Gateway/HTTPRoute below are hand-written and versioned here.
#
# Listeners:
#   - http (port 80):       legacy dev surface (hello, grafana hostname route).
#   - http-8000 (port 8000): the agent-facing immutable contract surface —
#     http://localhost:8000/v1 (WSL2 mirrored networking binds the servicelb LB
#     to localhost:8000). KServe's chat route + the explicit /healthz route
#     attach to both listeners (no hostname/sectionName filtering).
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: kserve-gateway-class
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kserve-gateway
  namespace: kserve
spec:
  gatewayClassName: kserve-gateway-class
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: http-8000
      protocol: HTTP
      port: 8000
      allowedRoutes:
        namespaces:
          from: All
