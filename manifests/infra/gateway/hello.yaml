# Hello-world HTTPRoute — proves the Gateway API stack routes end-to-end.
# Returns 200 from a tiny echo backend; replaced by KServe routes in Phase 3.
apiVersion: v1
kind: Service
metadata:
  name: hello-svc
  namespace: gpu-test
spec:
  selector:
    app: hello
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: gpu-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hello
          image: docker.io/hashicorp/http-echo:latest
          args: ["-text=hello from nanoserve", "-listen=:8080"]
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello
  namespace: gpu-test
spec:
  parentRefs:
    - name: kserve-gateway
      namespace: kserve
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /hello
      backendRefs:
        - name: hello-svc
          port: 8080
