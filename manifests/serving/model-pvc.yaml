# PersistentVolumeClaim for the locally-cached model weights.
#
# Statically bound to the hostPath PV (model-pv.yaml — `make download-model`
# materializes the flat model dir on the host). The LLMInferenceService mounts
# this claim via pvc://nanoserve-model-cache — the pod NEVER downloads over
# the (throttled) network.
#
# storageClassName must be "" (static binding) and volumeName must reference
# the PV. The OLD local-path claim of the same name must be deleted first
# (kubectl delete pvc nanoserve-model-cache -n kserve).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nanoserve-model-cache
  namespace: kserve
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: nanoserve-model-cache-pv
  resources:
    requests:
      storage: 8Gi
