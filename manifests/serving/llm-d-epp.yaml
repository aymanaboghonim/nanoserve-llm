# llm-d Endpoint Picker (EPP) — the router "brain" KServe's scheduler.pool.ref
# expects. In Gateway Mode it joins the GIE InferencePool: Envoy AI Gateway
# routes InferencePool traffic to this EPP (ext-proc), which picks the best
# vLLM pod (KV-cache aware, load-aware).
#
# This is a hand-written minimal equivalent of the llm-d-router Helm chart
# (config/charts/llm-d-router-gateway, which is local-only / not published to
# a public OCI registry). Mirrors the chart's Gateway Mode flags:
#   --pool-name <name>  --pool-namespace <ns>  --pool-group inference.networking.k8s.io
#
# Resources are capped well below the chart defaults (8-16Gi) to fit the
# 12GB box — a single-GPU local pool needs only a small EPP.
# Lives in the `kserve` namespace so the InferencePool's endpointPickerRef
# (same-namespace only per GIE) can reference the EPP Service directly.
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-d-epp
  namespace: kserve
data:
  default-plugins.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    plugins:
      - type: single-profile-handler
      - type: prefix-cache-scorer
      - type: load-aware-scorer
        parameters:
          threshold: 100
      - type: max-score-picker
    schedulingProfiles:
      - name: default
        plugins:
          - pluginRef: single-profile-handler
          - pluginRef: prefix-cache-scorer
          - pluginRef: load-aware-scorer
          - pluginRef: max-score-picker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-d-epp
  namespace: kserve
  labels:
    app: llm-d-epp
spec:
  replicas: 1
  strategy:
    type: Recreate  # single active replica (chart default for EPP)
  selector:
    matchLabels:
      app: llm-d-epp
  template:
    metadata:
      labels:
        app: llm-d-epp
    spec:
      serviceAccountName: llm-d-epp
      terminationGracePeriodSeconds: 130
      containers:
        - name: epp
          image: ghcr.io/llm-d/llm-d-router-endpoint-picker:v0.9.0
          imagePullPolicy: IfNotPresent
          args:
            - --pool-name
            - kserve-inference-pool
            - --pool-namespace
            - kserve
            - --pool-group
            - inference.networking.k8s.io
            - --zap-encoder
            - json
            - --config-file
            - /config/default-plugins.yaml
            - --metrics-endpoint-auth=false
            - --tracing=false
          ports:
            - name: grpc
              containerPort: 9002
            - name: grpc-health
              containerPort: 9003
            - name: metrics
              containerPort: 9090
          livenessProbe:
            grpc:
              port: 9003
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            grpc:
              port: 9003
            periodSeconds: 2
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "100m"
              memory: 128Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: plugins-config-volume
              mountPath: /config
      volumes:
        - name: plugins-config-volume
          configMap:
            name: llm-d-epp
---
apiVersion: v1
kind: Service
metadata:
  name: llm-d-epp
  namespace: kserve
spec:
  selector:
    app: llm-d-epp
  ports:
    - name: grpc
      port: 9002
      targetPort: 9002
    - name: grpc-health
      port: 9003
      targetPort: 9003
    - name: metrics
      port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-d-epp
  namespace: kserve
---
# EPP needs to read the inference-pool + llm-d CRDs and the model-server pods
# in the kserve namespace (pool selection + KV-cache aware scoring).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llm-d-epp
  namespace: kserve
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["inference.networking.k8s.io"]
    resources: ["inferencepools"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["llm-d.ai"]
    resources: ["inferenceobjectives", "inferencemodelrewrites"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llm-d-epp
  namespace: kserve
subjects:
  - kind: ServiceAccount
    name: llm-d-epp
    namespace: kserve
roleRef:
  kind: Role
  name: llm-d-epp
  apiGroup: rbac.authorization.k8s.io
