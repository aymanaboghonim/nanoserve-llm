# Envoy Gateway BackendTrafficPolicy — per-user request-rate limit on the local
# Tier-1 route (queue/429 test lever).
#
# Global rateLimit keyed per distinct `x-user-id` header: each user gets
# 20 req/min; requests WITHOUT the header are never limited (the load test's
# "normal" users omit it, a few "burst" users send it and trip the limit -> 429).
# Repository-2 does not send x-user-id, so this never throttles the agent.
#
# 20 req/min is a deliberate per-user test knob, NOT a capacity cap — it needs
# no retune for the Granite-4.2-3B model / 32K context (capacity is governed by
# the vLLM engine flags --max-num-seqs/--max-model-len and the fp8 KV pool).
#
# Requires the Envoy `envoy-ratelimit` server, which Envoy Gateway auto-deploys
# when a global rateLimit policy is applied (rateLimitDeployment block already
# in the EnvoyGateway config).
#
# CRITICAL: targetRefs MUST follow the KServe-generated HTTPRoute name, which
# derives from the LLMISVC name (granite-llm-kserve-route). If the LLMISVC is
# ever renamed, retarget this policy — an orphaned targetRef silently disables
# the 429 lever (a rename already bit this once).
#
# NOTE: AdmissionControl + RequestMirror are intentionally NOT used here — see
# manifests/serving/request-mirror-shadow.yaml (disabled) for the mirroring path.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: kserve-rate-limit
  namespace: kserve
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: granite-llm-kserve-route
  rateLimit:
    type: Global
    global:
      rules:
        - clientSelectors:
            - headers:
                - name: x-user-id
                  type: Distinct
          limit:
            requests: 20
            unit: Minute
