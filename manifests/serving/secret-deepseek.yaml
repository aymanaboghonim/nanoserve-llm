# DeepSeek API key — TEMPLATE only. The real key lives in the gitignored `.env`
# and is applied via the Makefile target (`make secret`), which never commits it.
#
#   # .env (gitignored)
#   DEEPSEEK_API_KEY=sk-...
#
#   make secret   # renders manifests/serving/secret-deepseek.yaml from .env
#
# The Secret is consumed by the EAG BackendSecurityPolicy (Tier 2) which injects
# the value into the upstream `Authorization` header. The key MUST be named
# `apiKey` — EAG requires it ("secret ... does not contain key apiKey").
apiVersion: v1
kind: Secret
metadata:
  name: deepseek-api-key
  namespace: kserve
type: Opaque
stringData:
  # placeholder — replaced by `make secret` from .env (gitignored)
  apiKey: "CHANGE_ME"
