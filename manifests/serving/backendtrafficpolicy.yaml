# Envoy Gateway BackendTrafficPolicy — protect the saturated local model.
#
# Two mechanisms, correct roles:
#   - RateLimit (Global):   hard ceiling on requests to the local Tier-1 route.
#   - AdmissionControl:     probabilistic rejection when the local model is
#                           saturated (success rate below threshold) — protects
#                           the 4GB KV budget from a thundering herd.
#
# NOTE: RequestBuffer is intentionally NOT used — incompatible with streaming
# /v1/chat/completions (Envoy docs).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: kserve-inference-policy
  namespace: kserve
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: kserve-shadow-route
  rateLimit:
    type: Global
    global:
      rules:
        - limit:
            requests: 60
            unit: Minute
  admissionControl:
    maxRejectionPercent: 80
    samplingWindow: 10s
    successCriteria:
      http:
        statusCodes:
          - 200
