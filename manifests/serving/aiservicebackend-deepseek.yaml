# AIServiceBackend for the cloud Tier-2 (DeepSeek).
#
# Envoy AI Gateway abstraction: wraps the Envoy Gateway `Backend` and declares
# the API schema. v1beta1 API: `schema.name: OpenAI` (no modelNames — model
# selection is done in the AIGatewayRoute by header match).
#
# backendRef MUST be an Envoy Gateway Backend (kind=Backend,
# group=gateway.envoyproxy.io) — CEL-validated; cannot point at a k8s Service.
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: deepseek-backend
  namespace: kserve
spec:
  schema:
    name: OpenAI
  backendRef:
    name: deepseek-backend
    kind: Backend
    group: gateway.envoyproxy.io
