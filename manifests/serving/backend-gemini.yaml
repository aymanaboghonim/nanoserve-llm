# Envoy Gateway Backend + BackendTLSPolicy for the cloud Tier-2 (Google AI
# Studio / Gemini OpenAI-compatible endpoint).
#
# The BackendTLSPolicy secures egress: Envoy originates TLS to
# generativelanguage.googleapis.com:443 using the SYSTEM CA bundle and SNI =
# hostname. Without it Envoy opens cleartext to :443 -> 503 (verified with the
# previous DeepSeek backend).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: gemini-backend
  namespace: kserve
spec:
  type: Endpoints
  endpoints:
    - fqdn:
        hostname: generativelanguage.googleapis.com
        port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: gemini-backend
  namespace: kserve
spec:
  targetRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: gemini-backend
  validation:
    # SNI must match the certificate Google serves for this hostname.
    hostname: generativelanguage.googleapis.com
    # Public Google certs chain to the public roots (System store).
    wellKnownCACertificates: System
