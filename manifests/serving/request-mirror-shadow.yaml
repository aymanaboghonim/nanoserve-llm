# RequestMirror shadow route — shadow-test the Tier-2 (DeepSeek) backend
# with a copy of local-model traffic, WITHOUT affecting the primary response.
#
# This is a Gateway API HTTPRoute filter: fire-and-forget (responses ignored).
# It is NOT failover — it is shadow testing.
#
# NOTE: the AIGatewayRoute above is the primary route for chat completions.
# This HTTPRoute attaches to the same Gateway listener and mirrors a
# percentage of local-model requests to a dedicated mirror backend. In
# production the mirror target would be a Sidecar/mock of DeepSeek to avoid
# real cost; enable the real AIServiceBackend when validating.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kserve-shadow-route
  namespace: kserve
spec:
  parentRefs:
    - name: kserve-gateway
      namespace: kserve
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/chat/completions
      filters:
        - type: RequestMirror
          requestMirror:
            backendRef:
              group: aigateway.envoyproxy.io
              kind: AIServiceBackend
              name: deepseek-backend
              namespace: kserve
            # Mirror 10% of requests for shadow testing.
            percent: 10
      backendRefs:
        - name: kserve-inference-pool
          namespace: kserve
