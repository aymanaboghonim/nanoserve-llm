# RequestMirror shadow route — shadow-test the Tier-2 (DeepSeek) backend
# with a copy of local-model traffic, WITHOUT affecting the primary response.
#
# This is a Gateway API HTTPRoute filter: fire-and-forget (responses ignored).
# It is NOT failover — it is shadow testing.
#
# Gateway API constraint: RequestMirror.backendRef must be a k8s Service with
# a port (it cannot reference an AIServiceBackend). The mirror target is the
# DeepSeek-facing echo Service below (replace with the real Tier-2 Service
# when wiring live). In production point this at a mock/sidecar to avoid real
# cloud cost while validating.
apiVersion: v1
kind: Service
metadata:
  name: deepseek-mirror-svc
  namespace: kserve
spec:
  selector:
    app: deepseek-mirror
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kserve-shadow-route
  namespace: kserve
spec:
  parentRefs:
    - name: kserve-gateway
      namespace: kserve
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/chat/completions
      filters:
        - type: RequestMirror
          requestMirror:
            backendRef:
              name: deepseek-mirror-svc
              namespace: kserve
              port: 80
            # Mirror 10% of requests for shadow testing.
            percent: 10
      backendRefs:
        - name: kserve-inference-pool
          namespace: kserve
          port: 8000
