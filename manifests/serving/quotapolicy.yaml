# Per-user quota limits via Envoy AI Gateway QuotaPolicy (v1alpha1).
#
# targetRefs MUST reference AIServiceBackend resources (CEL-validated).
# Applies a token-bucket budget (duration + limit) per model via
# perModelQuotas. The local Tier-1 model shares the 4GB KV budget — quotas
# protect it from a single client saturating the KV cache.
apiVersion: aigateway.envoyproxy.io/v1alpha1
kind: QuotaPolicy
metadata:
  name: deepseek-quota
  namespace: kserve
spec:
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: deepseek-backend
  perModelQuotas:
    - modelName: deepseek-chat
      quota:
        mode: Shared
        defaultBucket:
          duration: 1m
          limit: 100
