# Envoy Gateway `Backend` for the cloud Tier-2 (DeepSeek OpenAI-compatible API).
#
# Envoy AI Gateway's `AIServiceBackend.backendRef` REQUIRES this kind
# (gateway.envoyproxy.io/v1alpha1 Backend) — it cannot reference a k8s Service.
# See https://github.com/envoyproxy/ai-gateway/issues/902.
#
# The Authorization header (DeepSeek API key) is injected by the gateway from
# the deepseek-api-key Secret referenced via Envoy Gateway's secret credential
# mechanism at the route level (see backendtrafficpolicy / secret-deepseek).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: deepseek-backend
  namespace: kserve
spec:
  type: Endpoints
  endpoints:
    - fqdn:
        hostname: api.deepseek.com
        port: 443
