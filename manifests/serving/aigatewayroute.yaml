# Cloud Tier-2 routing via Envoy AI Gateway AIGatewayRoute (v1beta1).
#
# The LOCAL Tier-1 model is routed by KServe's own generated HTTPRoute
# (qwen-llm-kserve-route → InferencePool → Envoy Gateway/GIE), so this
# AIGatewayRoute carries ONLY the cloud DeepSeek rule. The AI-GW controller
# resolves AIGatewayRoute backendRefs as AIServiceBackends (it cannot target
# an InferencePool) — mixing them is what the audit flagged.
#
# Model selection is by HTTP header match (`x-ai-eg-model`).
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: kserve-ai-route
  namespace: kserve
spec:
  parentRefs:
    - name: kserve-gateway
      group: gateway.networking.k8s.io
      kind: Gateway
  rules:
    # Tier 2 — cloud DeepSeek (AIServiceBackend → Envoy Backend).
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: deepseek-chat
      backendRefs:
        - name: deepseek-backend
          namespace: kserve
