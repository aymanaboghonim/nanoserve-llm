# Argo CD app-of-apps — manages all NanoServe manifests declaratively.
#
# Each Application points at a kustomize bundle in the repo; Argo CD syncs the
# cluster state from Git and surfaces drift:
#   - nanoserve-infra      manifests/infra       -> namespace default
#                          (NVIDIA device plugin, GPU smoke, gateway platform)
#   - nanoserve-serving    manifests/serving     -> namespace kserve
#   - nanoserve-telemetry  manifests/telemetry   -> namespace monitoring
#
# Repo is public (https://github.com/aymanaboghonim/nanoserve-llm). Day-1
# bootstrapping still runs the infra scripts first (gateway-stack.sh installs
# the CRDs + Envoy controllers; argo/install.sh installs Argo); Argo then owns
# day-2 drift for the resources below.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nanoserve-infra
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/aymanaboghonim/nanoserve-llm.git
    targetRevision: main
    path: manifests/infra
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nanoserve-serving
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/aymanaboghonim/nanoserve-llm.git
    targetRevision: main
    path: manifests/serving
  destination:
    server: https://kubernetes.default.svc
    namespace: kserve
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nanoserve-telemetry
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/aymanaboghonim/nanoserve-llm.git
    targetRevision: main
    path: manifests/telemetry
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
